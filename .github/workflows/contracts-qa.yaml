name: Contracts QA

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  format:
    name: Format Check

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            node_modules
            contracts/node_modules
          key: contracts-node-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun i --frozen-lockfile

      - name: Check format
        run: bun --filter contracts format:check

  diff:
    name: Generated Code Diff Check

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            node_modules
            contracts/node_modules
          key: contracts-node-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun i --frozen-lockfile

      - name: Check generate code has diff
        run: |
          bun --filter contracts compile:viewer
          bun --filter contracts compile:admin
          if [ -n "$(git status --porcelain | grep generated)" ]; then
            echo "自動生成コードに差分があります"
            git status
            exit 1
          fi
