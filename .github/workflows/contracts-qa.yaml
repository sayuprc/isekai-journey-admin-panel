name: Contracts QA

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  format:
    name: Format Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.6

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/contracts/node_modules
          key: contracts-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Check format
        run: mise run contract:format:check

  diff:
    name: Generated Code Diff Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.6

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/contracts/node_modules
          key: contracts-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Check generate code has diff
        run: |
          mise run contract:compile:all
          if [ -n "$(git status --porcelain | grep generated)" ]; then
            echo "自動生成コードに差分があります"
            git status
            exit 1
          fi
