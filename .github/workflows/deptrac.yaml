name: Deptrac

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  setup-php:
    uses: ./.github/workflows/setup-php.yaml

  check:
    needs: setup-php

    name: Deptrac (PHP ${{ needs.setup-php.outputs.version }})

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.setup-php.outputs.version }}
          extensions: grpc
          tools: composer

      - name: Composer cache
        id: composer_cache
        uses: actions/cache@v4
        with:
          path: ./src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Check Layer
        run: |
          echo 'Check Layer'
          cd src
          composer deptrac
