name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  setup:
    uses: ./.github/workflows/setup.yaml

  test:
    needs: setup

    name: PHPUnit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Cache docker image
        id: cache-docker-image
        uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.docker-cache-path }}
          key: ${{ needs.setup.outputs.docker-cache-key }}

      - name: Load image
        if: steps.cache-docker-image.outputs.cache-hit == 'true'
        run: gunzip -c ${{ needs.setup.outputs.docker-cache }} | docker load

      - name: Run Container
        run: docker compose up -d php

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.vendor-cache-path }}
          key: ${{ needs.setup.outputs.composer-cache-key }}

      - name: Move vendor
        if: steps.cache-composer.outputs.cache-hit == 'true'
        run: tar -xzf ${{ needs.setup.outputs.vendor-cache }}

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.npm-cache-path }}
          key: ${{ needs.setup.outputs.npm-cache-key }}

      - name: Move npm
        if: steps.cache-npm.outputs.cache-hit == 'true'
        run: tar -xzf ${{ needs.setup.outputs.npm-cache }}

      - name: Cache database
        id: cache-database
        uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.database-cache-path }}
          key: ${{ needs.setup.outputs.database-cache-key }}

      - name: Move database
        if: steps.cache-database.outputs.cache-hit == 'true'
        run: tar -xzf ${{ needs.setup.outputs.database-cache }}

      - name: Setup env
        run: |
          cp src/.env.testing.example src/.env.testing
          docker exec ${{ needs.setup.outputs.container }} php artisan key:generate --env=testing

      - name: Build
        run: docker exec ${{ needs.setup.outputs.container }} npm run build

      - name: Dump autoload
        run: docker exec ${{ needs.setup.outputs.container }} composer dump-autoload

      - name: Run PHPUnit
        run: docker exec ${{ needs.setup.outputs.container }} composer test-all
