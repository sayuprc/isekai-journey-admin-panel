name: Server QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - dev

env:
  MISE_ENV: ci

jobs:
  setup:
    name: Setup server
    runs-on: ubuntu-latest
    outputs:
      vendor-key: ${{ steps.define-variables.outputs.VENDOR_KEY }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Define variables
        id: define-variables
        run: |
          echo "VENDOR_KEY=${VENDOR_KEY_PREFIX}${{ hashFiles('./src/server/composer.lock') }}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Cache server docker image
        id: cache-server-docker-image
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SERVER_DOCKER_PATH }}
          key: ${{ env.SERVER_DOCKER_KEY_PREFIX }}${{ hashFiles('./docker/php/Dockerfile') }}

      - name: Build server image
        if: steps.cache-server-docker-image.outputs.cache-hit != 'true'
        run: mise run build:php

      - name: Cache openapi-generator-cli docker image
        id: cache-openapi-generator-cli-docker-image
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.OPENAPI_GENERATOR_CLI_DOCKER_PATH }}
          key: ${{ env.OPENAPI_GENERATOR_CLI_DOCKER_KEY_PREFIX }}${{ hashFiles('./docker/openapi-generator/Dockerfile') }}

      - name: Build openapi-generator-cli image
        if: steps.cache-openapi-generator-cli-docker-image.outputs.cache-hit != 'true'
        run: mise run build:openapi-generator

      - name: Cache mysql docker image
        id: cache-mysql-docker-image
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.MYSQL_DOCKER_PATH }}
          key: ${{ env.MYSQL_DOCKER_KEY_PREFIX }}${{ hashFiles('./docker/mysql/Dockerfile', './docker/mysql/my.cnf', './docker/mysql/init/*') }}

      - name: Build mysql image
        if: steps.cache-mysql-docker-image.outputs.cache-hit != 'true'
        run: mise run build:mysql

      - name: Copy .env
        run: cp src/server/.env.example src/server/.env

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.VENDOR_PATH }}
          key: ${{ steps.define-variables.outputs.VENDOR_KEY }}

      - name: Composer install
        if: steps.cache-composer.outputs.cache-hit != 'true'
        run: mise run composer:install

      - name: Check generate code has diff
        run: mise run generate:server

  arkitect:
    needs: setup
    name: Arkitect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.VENDOR_PATH }}
          key: ${{ needs.setup.outputs.vendor-key }}

      - name: Check Layer
        run: mise run arkitect

  ecs:
    needs: setup
    name: EasyCodingStandard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.VENDOR_PATH }}
          key: ${{ needs.setup.outputs.vendor-key }}

      - name: Run ecs
        run: mise run ecs

  phpstan:
    needs: setup
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.VENDOR_PATH }}
          key: ${{ needs.setup.outputs.vendor-key }}

      - name: Run PHPStan
        run: mise run phpstan

  phpunit:
    needs: setup
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Container
        run: mise run up:test

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if docker exec isekai-terrarium-mysql mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.VENDOR_PATH }}
          key: ${{ needs.setup.outputs.vendor-key }}

      - name: Setup env
        run: mise run setup:env

      - name: Run migration
        run: mise run migrate

      - name: Run PHPUnit
        run: mise run test:all
