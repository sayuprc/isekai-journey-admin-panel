name: Update Actions Versions

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.6

      - name: Update action versions
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: pinact run --min-age 7 --update

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: auto/update-actions-version
          commit-message: 'ci: update pinned actions versions'
          title: 'ci: update pinned actions versions'
          body: |
            GitHub Actions で `pinact run --min-age 7 --update` を実行した差分です。
          delete-branch: true
