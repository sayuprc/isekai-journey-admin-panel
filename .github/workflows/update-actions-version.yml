name: Update Actions Versions

on:
  schedule:
    # 毎月 1 日・15 日 JST 9:00 (UTC 0:00)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Update action versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pinact run --min-age 7 --update

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto/update-actions-version
          commit-message: 'ci: update pinned actions versions'
          title: 'ci: update pinned actions versions'
          body: |
            GitHub Actions で `pinact run --min-age 7 --update` を実行した差分です。
          delete-branch: true
