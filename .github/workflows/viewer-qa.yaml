name: Viewer QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - dev

env:
  MISE_ENV: ci

jobs:
  diff:
    name: Generated Code Diff Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: mise run pnpm:install

      - name: Check generate code has diff
        run: mise run viewer:generate

  format:
    name: Format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: mise run pnpm:install

      - name: Run Format Check
        run: mise run viewer:format:check

