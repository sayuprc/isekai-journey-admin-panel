name: Viewer QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - dev

env:
  MISE_ENV: ci

jobs:
  diff:
    name: Generated Code Diff Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.6

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Check generate code has diff
        run: mise run viewer:generate

  format:
    name: Format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.6

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Run Format Check
        run: mise run viewer:format:check

  lint:
    name: ESLint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Run ESLint
        run: mise run viewer:lint

  style:
    name: Stylelint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/node_modules
            src/viewer/node_modules
          key: viewer-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run pnpm:install

      - name: Run Stylelint
        run: mise run viewer:style

      # - name: Run Build
      #   run: bun run build
