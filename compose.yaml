services:
  proxy:
    image: ${PROXY_IMAGE}
    container_name: isekai-terrarium-proxy
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/site.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - host.docker.internal:host-gateway

  php:
    image: ${SERVER_IMAGE}
    container_name: isekai-terrarium-admin-php
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    ports:
      - 8080:80
    volumes:
      - ./src/server:/var/www/html
      - ./src/contracts:/var/www/contracts
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini

  redis:
    image: redis:8.2
    ports:
      - 6379:6379

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - 8079:80
    environment:
      SRH_MODE: 'env'
      SRH_TOKEN: 'example_token'
      SRH_CONNECTION_STRING: 'redis://redis:6379'
