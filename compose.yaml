services:
  proxy:
    image: ${PROXY_IMAGE:-isekai-observatory-proxy:1.27}
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/site.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    ports:
      - ${PROXY_HTTP_PORT:-80}:80
      - ${PROXY_HTTPS_PORT:-443}:443
    extra_hosts:
      - host.docker.internal:host-gateway

  php:
    image: ${SERVER_IMAGE:-isekai-observatory-api:8.5}
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    ports:
      - ${PHP_HTTP_PORT:-8080}:80
    volumes:
      - ./src/server:/var/www/html
      - ./src/contracts:/var/www/contracts
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini

  mysql:
    image: ${MYSQL_IMAGE:-isekai-observatory-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isekai_observatory
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      TZ: Asia/Tokyo
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8.2
    ports:
      - ${REDIS_PORT:-6379}:6379

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - ${REDIS_HTTP_PORT:-8079}:80
    environment:
      SRH_MODE: 'env'
      SRH_TOKEN: '${REDIS_HTTP_TOKEN:-dev-token}'
      SRH_CONNECTION_STRING: 'redis://redis:6379'

volumes:
  mysql_data:
