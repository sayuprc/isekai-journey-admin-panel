services:
  web:
    image: isekai-terrarium-admin-web:1.25
    container_name: isekai-terrarium-admin-web
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    ports:
      - 8080:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/server:/var/www/html

  php:
    image: isekai-terrarium-admin-php:8.4
    container_name: isekai-terrarium-admin-php
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    ports:
      - 5173:5173
    extra_hosts:
      - local.api.terrarium.isekaijoucho.fan:host-gateway
    volumes:
      - ./src/server:/var/www/html
      - ./src/proto:/var/www/proto
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini

  node:
    image: isekai-terrarium-admin-node:22
    container_name: isekai-terrarium-admin-node
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    tty: true
    ports:
      - 4321:4321
    extra_hosts:
      - local.api.terrarium.isekaijoucho.fan:host-gateway
    volumes:
      - ./src/client:/app/src
      - ./src/proto:/app/proto
