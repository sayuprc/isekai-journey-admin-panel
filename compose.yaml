services:
  proxy:
    image: isekai-terrarium-proxy:1.27
    container_name: isekai-terrarium-proxy
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/site.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - host.docker.internal:host-gateway

  php:
    image: isekai-terrarium-admin-php:8.5
    container_name: isekai-terrarium-admin-php
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    ports:
      - 8080:80
    volumes:
      - ./src/server:/var/www/html
      - ./src/contracts:/var/www/contracts
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini

  node:
    image: isekai-terrarium-admin-node:22
    container_name: isekai-terrarium-admin-node
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      NODE_EXTRA_CA_CERTS: /usr/share/ca-certificates/rootCA.pem
    tty: true
    ports:
      - 4321:4321
      - 4010:4010
    extra_hosts:
      - local.admin.terrarium.isekaijoucho.fan:host-gateway
    volumes:
      - ./src/client:/app/src
      - ./src/contracts:/app/contracts
