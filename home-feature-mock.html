<!DOCTYPE html>
<html lang="ja" data-palette="anemone-1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームの最新リリース枠 — 案1 / 案2 / 案3 (モック)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  [data-palette="anemone-1"] {
    --bg: #0e0e10;
    --bg-elev: #151518;
    --fg: #f4f4f5;
    --fg-muted: #939395;
    --fg-faint: #808082;
    --line: #353537;
    --line-soft: #232325;
    --accent: #d31b28;
    --accent-faint: #451217;
    --accent-contrast: #fff;
    --paper: #1c1c21;
  }

  [data-palette="nemophila-1"] {
    --bg: #f5f7fa;
    --bg-elev: #fff;
    --fg: #1a1d20;
    --fg-muted: #76797c;
    --fg-faint: #727477;
    --line: #d0d2d5;
    --line-soft: #e1e3e6;
    --accent: #1c8bf4;
    --accent-faint: #b8d9f8;
    --accent-contrast: #fff;
    --paper: #d2e6ff;
  }

  :root {
    --jp: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--jp);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1480px; margin: 0 auto; padding: 0 40px; }

  .page-head { padding: 56px 0 0; }

  .page-head h1 {
    font-family: var(--mincho);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: .1em;
  }

  .page-note { margin-top: 12px; font-size: 13px; color: var(--fg-muted); max-width: 72em; }

  .controls { display: flex; gap: 10px; align-items: center; margin: 22px 0 0; }

  .controls-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    color: var(--fg-faint);
  }

  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--fg-muted);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
  }

  button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }

  .case { margin-top: 72px; }

  .case-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 8px;
  }

  .case-title { font-family: var(--mincho); font-size: 20px; letter-spacing: .06em; }

  .case-note { font-size: 12px; color: var(--fg-faint); }

  .variant-label {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--fg-muted);
  }

  .variant-label:first-of-type { margin-top: 22px; }

  .feature-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 600px), 1fr));
    gap: 64px;
    margin-top: 18px;
  }

  .feature { max-width: 720px; }

  .section-head {
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }

  .section-head span {
    font-family: var(--mincho);
    font-size: 17px;
    letter-spacing: .08em;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    color: var(--fg-faint);
  }

  .feature-title {
    font-family: var(--mincho);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.4;
    margin: 6px 0 10px;
  }

  .btn {
    display: inline-block;
    margin-top: 16px;
    font-size: 13px;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 16px;
    text-decoration: none;
  }

  .summary { font-size: 13px; color: var(--fg-muted); }

  /* 最新楽曲（固定・変更なし） */

  .song-grid { display: grid; grid-template-columns: 240px 1fr; gap: 28px; }

  .thumb {
    aspect-ratio: 16 / 9;
    background: repeating-linear-gradient(45deg, var(--paper), var(--paper) 8px, var(--bg-elev) 8px, var(--bg-elev) 16px);
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--fg-faint);
    text-align: center;
    padding: 8px;
  }

  /* 収録曲共通 */

  .track-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 18px;
  }

  .track {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
    min-width: 0;
  }

  .track-no {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg-faint);
    width: 1.8em;
  }

  .track-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .track[data-linked="0"] .track-name { color: var(--fg-faint); }

  .track-more { font-size: 12px; color: var(--fg-faint); margin-top: 8px; }

  /* ---------- 案1: 大きな色面なし（帯アクセントのみ） ---------- */

  .v1-body {
    padding-left: 16px;
    border-left: 3px solid var(--c);
  }

  .v1-body .track-list { margin-top: 4px; }

  /* ---------- 案2: 小さな色見本 + 細い縦帯 ---------- */

  .v2-grid {
    display: grid;
    grid-template-columns: 3px 26px 1fr;
    gap: 14px;
    align-items: start;
  }

  .v2-bar {
    width: 3px;
    min-height: 100%;
    align-self: stretch;
    background: var(--c);
  }

  .v2-swatch {
    width: 26px;
    height: 26px;
    margin-top: 4px;
    border-radius: 2px;
    background-color: var(--c);
    background-image: var(--noise);
    background-blend-mode: soft-light;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07);
  }

  .v2-body .feature-title { margin-top: 4px; }

  /* ---------- 案3: 左右対称をやめて全幅構図 ---------- */

  .v3-body { max-width: 100%; }

  .v3-title {
    font-family: var(--mincho);
    font-size: clamp(32px, 4vw, 44px);
    font-weight: 500;
    line-height: 1.35;
    letter-spacing: .04em;
    margin: 8px 0 0;
  }

  .v3-rule {
    height: 3px;
    width: min(120px, 30%);
    margin: 14px 0 18px;
    background: var(--c);
  }

  .v3-body .track-list {
    max-width: 640px;
  }

  /* 参考: 現行（大きな色面） */

  .current-grid {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 28px;
    align-items: start;
  }

  .current-color {
    aspect-ratio: 1;
    background-color: var(--c);
    background-image: var(--noise);
    background-blend-mode: soft-light;
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07);
  }

  footer {
    margin: 88px 0 60px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--fg-faint);
    line-height: 2;
  }

  @media (width <= 720px) {
    .shell { padding: 0 20px; }
    .song-grid { grid-template-columns: 1fr; }
    .track-list { grid-template-columns: 1fr; }
    .current-grid { grid-template-columns: 1fr; }
    .v2-grid { grid-template-columns: 3px 1fr; }
    .v2-swatch { display: none; }
  }
</style>
</head>
<body>

<div class="shell">

  <div class="page-head">
    <h1>ホームの最新リリース枠 — 3案比較</h1>
    <p class="page-note">
      左の最新楽曲は YouTube サムネイルのまま。右の最新リリースだけ構図を変えます。
      案1: 大きな色面なし（左ボーダーだけ） /
      案2: 細い帯 + 小さなノイズ見本 /
      案3: 疑似ジャケット左右分割をやめ、全幅でタイトル→収録曲。
      参考として現行の大きな色面も末尾に置いています。色は仮の値です。
    </p>
    <div class="controls">
      <span class="controls-label">配色</span>
      <button type="button" data-palette-set="anemone-1" aria-pressed="true">暗</button>
      <button type="button" data-palette-set="nemophila-1" aria-pressed="false">明</button>
    </div>
  </div>

  <div id="cases"></div>

  <footer>
    比較用モックです。実データの最新リリース（1曲シングル）と直近アルバムを使っています。
    採用案が決まったら viewer の index.astro / viewer.css に反映します。
  </footer>

</div>

  const more = tracks.length > TRACK_LIMIT
    ? `<div class="track-more">ほか ${tracks.length - TRACK_LIMIT} 曲</div>`
    : '';

  return `<div class="track-list">
      ${shown.map(([title, linked], index) => `<span class="track" data-linked="${linked}">
        <span class="track-no">${String(index + 1).padStart(2, '0')}</span>
        <span class="track-name">${escapeHtml(title)}</span>
      </span>`).join('')}
    </div>${more}`;
}

function songFeature() {
  return `<div class="feature">
    <div class="section-head"><span>最新楽曲</span></div>
    <div class="song-grid">
      <div class="thumb">YOUTUBE<br>THUMBNAIL</div>
      <div>
        <div class="eyebrow">オリジナル</div>
        <h3 class="feature-title">深海のフレイム</h3>
        <p class="summary">この枠は今回の変更を受けません</p>
        <a class="btn" href="#">楽曲詳細 →</a>
      </div>
    </div>
  </div>`;
}

/** 案1: 大きな色面をやめる */
function variant1(group) {
  const color = placeholderColor(group.t);

  return `<div class="feature">
    <div class="section-head"><span>最新リリース</span></div>
    <div class="v1-body" style="--c:${color}">
      <div class="eyebrow">${TYPE[group.y]} — ${group.d}</div>
      <h3 class="feature-title">${escapeHtml(group.t)}</h3>
      ${trackListHtml(group)}
      <a class="btn" href="#">リリース詳細 →</a>
    </div>
  </div>`;
}

/** 案2: 色は残すが小さく */
function variant2(group) {
  const color = placeholderColor(group.t);

  return `<div class="feature">
    <div class="section-head"><span>最新リリース</span></div>
    <div class="v2-grid" style="--c:${color}">
      <div class="v2-bar" aria-hidden="true"></div>
      <div class="v2-swatch" aria-hidden="true"></div>
      <div class="v2-body">
        <div class="eyebrow">${TYPE[group.y]} — ${group.d}</div>
        <h3 class="feature-title">${escapeHtml(group.t)}</h3>
        ${trackListHtml(group)}
        <a class="btn" href="#">リリース詳細 →</a>
      </div>
    </div>
  </div>`;
}

/** 案3: 楽曲枠との左右対称をやめて全幅構図 */
function variant3(group) {
  const color = placeholderColor(group.t);

  return `<div class="feature">
    <div class="section-head"><span>最新リリース</span></div>
    <div class="v3-body" style="--c:${color}">
      <div class="eyebrow">${TYPE[group.y]} — ${group.d}</div>
      <h3 class="v3-title">${escapeHtml(group.t)}</h3>
      <div class="v3-rule" aria-hidden="true"></div>
      ${trackListHtml(group)}
      <a class="btn" href="#">リリース詳細 →</a>
    </div>
  </div>`;
}

/** 参考: 現行の大きな色面 */
function variantCurrent(group) {
  const color = placeholderColor(group.t);

  return `<div class="feature">
    <div class="section-head"><span>最新リリース（現行・参考）</span></div>
    <div class="current-grid" style="--c:${color}">
      <div class="current-color" aria-hidden="true"></div>
      <div>
        <div class="eyebrow">${TYPE[group.y]} — ${group.d}</div>
        <h3 class="feature-title">${escapeHtml(group.t)}</h3>
        ${trackListHtml(group)}
        <a class="btn" href="#">リリース詳細 →</a>
      </div>
    </div>
  </div>`;
}

const latest = D[0];
const album = D.find(group => group.y === 2 && group.m.flat().length >= 12);

const cases = [
  { title: '最新が 1 曲シングルの場合', note: `${latest.t} / ${latest.m.flat().length}曲`, group: latest },
  { title: '最新がアルバムの場合', note: `${album.t} / ${album.m.flat().length}曲`, group: album },
];

const variants = [
  { label: '案1 — 大きな色面なし（左ボーダーだけ）', render: variant1 },
  { label: '案2 — 細い帯 + 小さなノイズ見本', render: variant2 },
  { label: '案3 — 全幅（タイトル大きく → 色ライン → 収録曲）', render: variant3 },
  { label: '参考 — 現行の大きな色面', render: variantCurrent },
];

document.getElementById('cases').innerHTML = cases.map(entry => `
  <section class="case">
    <div class="case-head">
      <span class="case-title">${entry.title}</span>
      <span class="case-note">${escapeHtml(entry.note)}</span>
    </div>
    ${variants.map(variant => `
      <div class="variant-label">${variant.label}</div>
      <div class="feature-row">${songFeature()}${variant.render(entry.group)}</div>
    `).join('')}
  </section>
`).join('');

document.querySelectorAll('[data-palette-set]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-palette-set]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
    document.documentElement.dataset.palette = button.dataset.paletteSet;
  });
});
</script>
</body>
</html>
