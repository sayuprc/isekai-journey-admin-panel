steps:
  - id: pull-api-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:latest || exit 0

  - id: pull-cli-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:latest || exit 0

  - id: pull-db-migrate-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:latest || exit 0

  - id: pull-admin-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:latest || exit 0

  - id: pull-viewer-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:latest || exit 0

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - pull-api-image
    args:
      - build
      - -f
      - infra/staging/docker/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:latest
      - .

  - id: build-cli-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - pull-cli-image
    args:
      - build
      - -f
      - infra/staging/docker/cli/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:latest
      - .

  - id: build-db-migrate-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - pull-db-migrate-image
    args:
      - -c
      - |
        set -euo pipefail

        MISE_VERSION=$$(./tools/read-mise-value.sh mise_version)

        docker build \
          -f infra/staging/docker/db-migrate/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:latest \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:latest \
          --build-arg "MISE_VERSION=$${MISE_VERSION}" \
          .

  - id: build-admin-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - pull-admin-image
    args:
      - -c
      - |
        set -euo pipefail

        BUN_VERSION=$$(./tools/read-mise-value.sh bun)

        docker build \
          -f infra/staging/docker/admin/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:latest \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:latest \
          --build-arg "BUN_VERSION=$${BUN_VERSION}" \
          --build-arg "PUBLIC_APP_URL=${_PUBLIC_APP_URL}" \
          .

  - id: build-viewer-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - pull-viewer-image
    args:
      - -c
      - |
        set -euo pipefail

        NODE_VERSION=$$(./tools/read-mise-value.sh node)

        docker build \
          -f infra/staging/docker/viewer/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:latest \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:latest \
          --build-arg "NODE_VERSION=$${NODE_VERSION}" \
          .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-api-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}

  - id: push-cli-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-cli-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}

  - id: push-db-migrate-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-db-migrate-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}

  - id: push-admin-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-admin-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}

  - id: push-viewer-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-viewer-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}

  # TODO マイグレーションを別で行う
  - id: deploy-db-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - push-db-migrate-image
    args:
      - run
      - jobs
      - deploy
      - stg-db-migrate
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      # - --wait
      - --quiet

  - id: deploy-admin-invite
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - push-cli-image
    args:
      - run
      - jobs
      - deploy
      - stg-admin-invite
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      - --quiet

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - push-api-image
    args:
      - run
      - deploy
      - stg-isekai-api
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_API_SERVICE_ACCOUNT}
      - --ingress
      - ${_API_INGRESS}
      - --quiet

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - push-admin-image
    args:
      - run
      - deploy
      - stg-isekai-admin
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_ADMIN_SERVICE_ACCOUNT}
      - --ingress
      - ${_ADMIN_INGRESS}
      - --quiet

  # TODO デプロイは別に行う
  - id: deploy-viewer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - push-viewer-image
    args:
      - run
      - jobs
      - deploy
      - stg-viewer-deploy
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      - --set-env-vars
      # staging はクロール不要のため SITE_NOINDEX で robots.txt と meta robots を noindex にする
      - API_URL=${_API_URL},SITE_URL=${_SITE_URL},SITE_NOINDEX=true,CLOUDFLARE_WORKER_NAME=${_CLOUDFLARE_WORKER_NAME},CLOUDFLARE_ACCOUNT_ID=${_CLOUDFLARE_ACCOUNT_ID}
      - --set-secrets
      - CLOUDFLARE_API_TOKEN=${_CLOUDFLARE_API_TOKEN_SECRET_ID}:latest
      # - --wait
      - --quiet

  # admin-proxy Worker はイメージ不要のため Cloud Build から直接 wrangler でデプロイする。
  # Worker の secret (PROXY_SHARED_SECRET) はデプロイをまたいで保持されるためここでは設定しない
  - id: deploy-admin-proxy
    name: node:24-slim
    entrypoint: bash
    waitFor: ["-"]
    env:
      - CLOUDFLARE_ACCOUNT_ID=${_CLOUDFLARE_ACCOUNT_ID}
      - ADMIN_PROXY_WORKER_NAME=${_ADMIN_PROXY_WORKER_NAME}
      - ADMIN_PROXY_ORIGIN_URL=${_ADMIN_PROXY_ORIGIN_URL}
    secretEnv:
      - CLOUDFLARE_API_TOKEN
    args:
      - -c
      - bash infra/staging/cloudbuild/admin-proxy-deploy "$$(date --iso-8601=seconds)"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_CLOUDFLARE_API_TOKEN_SECRET_ID}/versions/latest
      env: CLOUDFLARE_API_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
  # 費用を抑えるためにスペックを下げる
  # 費用と効果が見合うかを改めて試算してから設定する
  # machineType: 'E2_HIGHCPU_8'
