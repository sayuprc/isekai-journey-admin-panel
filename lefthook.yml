# Lefthook pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    api-ecs:
      root: "src/server/"
      glob: "{app,bootstrap,config,database,packages,routes,tests,tools}/**/*.php"
      run: mise run api:ecs -- {staged_files}

    api-phpstan:
      root: "src/server/"
      glob: "{app,bootstrap,packages}/**/*.php"
      run: mise run api:phpstan -- {staged_files}

    # admin:lint は eslint + stylelint のフルチェック。path 引数を受けないため staged_files は渡さない。
    admin-lint:
      root: "src/admin/"
      glob: "src/**/*.{ts,tsx,js,jsx,mjs,astro}"
      run: mise run admin:lint

    admin-style:
      root: "src/admin/"
      glob: "src/**/*.{css,astro}"
      run: mise run admin:style -- {staged_files}

    viewer-lint:
      root: "src/viewer/"
      glob: "src/**/*.{ts,tsx,js,jsx,mjs,astro}"
      run: mise run viewer:lint

    viewer-style:
      root: "src/viewer/"
      glob: "src/**/*.{css,astro}"
      run: mise run viewer:style -- {staged_files}

    contracts-format:
      root: "src/"
      glob: "contracts/src/**/*.tsp"
      run: mise run contract:format:check

    contracts-test:
      root: "src/"
      glob: "contracts/scripts/**/*.ts"
      run: mise run contract:test
