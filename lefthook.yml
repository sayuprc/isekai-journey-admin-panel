# Lefthook pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    php-ecs:
      root: "src/server/"
      glob: "{app,bootstrap,config,database,packages,routes,tests,tools}/**/*.php"
      run: docker exec isekai-observatory-api vendor/bin/ecs check --no-progress-bar -- {staged_files}

    php-phpstan:
      root: "src/server/"
      glob: "{app,bootstrap,packages}/**/*.php"
      run: docker exec isekai-observatory-api vendor/bin/phpstan analyze --no-progress -- {staged_files}

    eslint:
      root: "src/admin/"
      glob: "src/**/*.{ts,tsx,js,jsx,mjs,astro}"
      run: bunx eslint {staged_files}

    stylelint:
      root: "src/admin/"
      glob: "src/**/*.{css,astro}"
      run: bunx stylelint {staged_files}

    tsp-format:
      root: "src/contracts/"
      glob: "src/**/*.tsp"
      run: bun run format:check

    tsp-test:
      root: "src/contracts/"
      glob: "scripts/**/*.ts"
      run: bun test

