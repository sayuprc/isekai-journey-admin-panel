[env]
SERVER_IMAGE = "ghcr.io/sayuprc/isekai-observatory-api:{{vars.server_tag}}"
OPENAPI_IMAGE = "ghcr.io/sayuprc/openapi-generator:{{vars.openapi_tag}}"
MYSQL_IMAGE = "ghcr.io/sayuprc/isekai-observatory-mysql:{{vars.mysql_tag}}"
SERVER_DOCKER_PATH = "/tmp/cache/docker/server"
SERVER_DOCKER_KEY_PREFIX = "docker-server-"
VENDOR_PATH = "./src/server/vendor"
VENDOR_KEY_PREFIX = "composer-"
OPENAPI_GENERATOR_CLI_DOCKER_PATH = "/tmp/cache/docker/openapi-generator-cli"
OPENAPI_GENERATOR_CLI_DOCKER_KEY_PREFIX = "docker-openapi-generator-cli-"
MYSQL_DOCKER_PATH = "/tmp/cache/docker/mysql"
MYSQL_DOCKER_KEY_PREFIX = "docker-mysql-"

[tasks."build:php"]
description = "CI 向けに PHP イメージをビルドして GHCR にプッシュする"
run = '''
touch ./docker/php/certs/rootCA.pem
docker build -t $SERVER_IMAGE ./docker/php \
  --build-arg TAG={{vars.server_tag}} \
  --build-arg UID=$(id -u) \
  --build-arg GID=$(id -g) \
  --build-arg USERNAME=$(id -u -n) \
  --build-arg GROUPNAME=$(id -g -n)
docker push $SERVER_IMAGE
mkdir -p $SERVER_DOCKER_PATH
'''

[tasks."build:openapi-generator"]
description = "CI 向けに OpenAPI Generator イメージをビルドして GHCR にプッシュする"
run = '''
docker build -t $OPENAPI_IMAGE ./docker/openapi-generator \
  --build-arg TAG={{vars.openapi_tag}} \
  --build-arg UID=$(id -u) \
  --build-arg GID=$(id -g) \
  --build-arg USERNAME=$(id -u -n) \
  --build-arg GROUPNAME=$(id -g -n)
docker push $OPENAPI_IMAGE
mkdir -p $OPENAPI_GENERATOR_CLI_DOCKER_PATH
'''

[tasks."build:mysql"]
description = "CI 向けに MySQL イメージをビルドして GHCR にプッシュする"
run = '''
docker build -t $MYSQL_IMAGE ./docker/mysql \
  --build-arg TAG={{vars.mysql_tag}}
docker push $MYSQL_IMAGE
mkdir -p $MYSQL_DOCKER_PATH
'''

[tasks.up]
description = "CI 環境でコンテナを起動する"
run = "docker compose up -d php"

[tasks."up:test"]
description = "CI 環境でテスト用コンテナを起動する"
run = "docker compose up -d php mysql"

[tasks."composer:install"]
description = "CI 環境で composer install を実行する"
run = "docker exec {{vars.server_container}} composer install -n --prefer-dist"

[tasks."generate:server"]
description = "CI 環境でコード生成を行い、差分をチェックする"
run = '''
docker run --rm -u $(id -u):$(id -g) -v ".:/local" $OPENAPI_IMAGE generate \
  -i /local/src/contracts/generated/oas/${ADMIN_OAS_FILE} \
  -g php \
  -t /local/src/server/tools/openapi-generator/templates \
  -o /local/src/server/Generated

if [ -n "$(git status --porcelain)" ]; then
  echo "自動生成コードに差分があります"
  git status
  exit 1
fi
'''

[tasks."setup:env"]
description = "CI 環境の環境変数をセットアップする"
run = '''
cp src/server/.env.example src/server/.env
docker exec {{vars.server_container}} php artisan key:generate
'''

[tasks.migrate]
description = "CI 環境でスキーマをデータベースに適用する"
dir = "src/server/database/atlas"
run = 'atlas schema apply --env local --var "db_name=${DB_DATABASE}" --auto-approve'

[tasks.migrate.env]
_.file = "src/server/.env"

[tasks."generate:client:admin"]
description = "CI 環境でクライアントコード生成を行い、差分をチェックする"
dir = "src"
run = '''
bun --filter admin generate:api
if [ -n "$(git status --porcelain)" ]; then
  echo "自動生成コードに差分があります"
  git status
  exit 1
fi
'''

[tasks."bun:install"]
dir = "src"
run = "bun i --frozen-lockfile"
