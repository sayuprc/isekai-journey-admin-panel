[vars]
server_container = "isekai-terrarium-admin-php"
client_container = "isekai-terrarium-admin-node"
uid = "$(id -u)"
user_name = "$(id -un)"
gid = "$(id -g)"
group_name = "$(id -gn)"

[tasks.setup]
description = "環境構築をする"
run = [
  { task = "cert:make" },
  { task = "cert:copy-pem" },
  { task = "build" },
  { tasks = ["composer:install", "npm:install"] },
  { task = "up" },
]

[tasks.build]
description = "開発環境向けの Docker イメージをビルドする"
depends = "build:*"

[tasks."build:proxy"]
description = "Nginx のイメージをビルドする"
run = "docker build -t isekai-terrarium-proxy:1.27 ./docker/nginx"

[tasks."build:php"]
description = "PHP のイメージをビルドする"
run = '''
docker build -t isekai-terrarium-admin-php:8.4 ./docker/php \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:openapi-generator"]
description = "OpenAPI Generator のイメージをビルドする"
run = '''
docker build -t openapi-generator:latest ./docker/openapi-generator \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:node"]
description = "Node のイメージをビルドする"
run = "docker build -t isekai-terrarium-admin-node:22 ./docker/node"

[tasks.up]
description = "コンテナを起動する"
run = "docker compose up -d"

[tasks.down]
description = "コンテナを削除する"
run = "docker compose down"

[tasks.php]
description = "php コンテナの中に入る"
run = "docker exec -it {{vars.server_container}} bash"

[tasks."composer:install"]
description = "composer パッケージをインストールする"
run = "docker compose run --rm php composer install"

[tasks.phpstan]
description = "PHPStan を実行する"
usage = 'arg "[path]" var=#true help="静的解析対象パス"'
run = "docker exec {{vars.server_container}} composer phpstan ${usage_path}"

[tasks."phpstan:clear-cache"]
description = "PHPStan のキャッシュを削除する"
run = "docker exec {{vars.server_container}} composer phpstan-clear-cache"

[tasks.arkitect]
description = "PHPArkitect を実行する"
run = "docker exec {{vars.server_container}} composer arkitect"

[tasks.ecs]
description = "ECS を実行し、コードフォーマットをチェックする"
usage = 'arg "[path]" var=#true help="フォーマットチェック対象パス"'
run = "docker exec {{vars.server_container}} composer ecs ${usage_path}"

[tasks."ecs:fix"]
description = "ECS を実行し、フォーマットを自動修正する"
usage = 'arg "[path]" var=#true help="フォーマット自動修正対象パス"'
run = "docker exec {{vars.server_container}} composer ecs-fix ${usage_path}"

[tasks."test:all"]
description = "すべてのテストを実行する"
run = "docker exec {{vars.server_container}} composer test-all"

[tasks."test:unit"]
description = "Unit テストを実行する"
run = "docker exec {{vars.server_container}} composer test-unit"

[tasks."test:integration"]
description = "Integration テストを実行する"
run = "docker exec {{vars.server_container}} composer test-integration"

[tasks."test:feature"]
description = "Feature テストを実行する"
run = "docker exec {{vars.server_container}} composer test-feature"

[tasks.coverage]
description = "テストカバレッジを出力する"
run = "docker exec {{vars.server_container}} composer coverage"

[tasks.infection]
description = "ミューテーションテストを実行する"
run = "docker exec {{vars.server_container}} composer infection"

[tasks.metrics]
description = "コードメトリクスを出力する"
run = "docker exec {{vars.server_container}} composer metrics"

[tasks.migrate]
description = "マイグレーションを実行する"
run = "docker exec {{vars.server_container}} bash -c cd database/atlas; ./apply.sh"

[tasks.tinker]
description = "Laravel tinker を実行する"
run = "docker exec {{vars.server_container}} php artisan tinker"

[tasks.generate]
description = "OAS からコードを生成する"
depends = "generate:*"

[tasks."generate:server"]
description = "OAS からサーバーのコードを生成する"
run = '''
rm -rf ./src/server/Generated

docker run --rm -u {{vars.uid}}:{{vars.gid}} -v ".:/local" openapi-generator generate \
  -i /local/src/contracts/generated/oas/openapi.yaml \
  -g php \
  -t /local/src/server/tools/openapi-generator/templates \
  -o /local/src/server/Generated
'''

[tasks."generate:client"]
description = "OAS からクライアントのコードを生成する"
run = '''
rm -rf ./src/client/src/generated

docker exec {{vars.client_container}} npm run generate:api
'''

[tasks."cert:make"]
description = "自己署名証明書を作成する"
run = '''
mkcert \
  --key-file docker/nginx/certs/server.key \
  --cert-file docker/nginx/certs/server.crt \
  localhost \
  127.0.0.1 \
  local.admin.terrarium.isekaijoucho.fan \
  local.api.terrarium.isekaijoucho.fan \
  local.terrarium.isekaijoucho.fan
'''

[tasks."cert:copy-pem"]
description = "rootCA.pem をコピーする"
run = '''
caroot_pem=$(mkcert -CAROOT)/rootCA.pem
cp ${caroot_pem} docker/php/certs/
cp ${caroot_pem} docker/node/certs/
'''

[tasks.node]
description = "node のコンテナの中に入る"
run = "docker exec -it {{vars.client_container}} bash"

[tasks."npm:install"]
description = "npm のパッケージをインストールする"
run = "docker compose run --rm node npm i"

[tasks.format]
description = "ESLint と Stylelint を --fix オプション付きで実行する"
depends = ["lint:fix", "style:fix"]

[tasks.lint]
description = "ESLint を実行する"
run = "docker exec {{vars.client_container}} npm run lint"

[tasks."lint:fix"]
description = "ESLint を --fix オプション付きで実行する"
run = "docker exec {{vars.client_container}} npm run lint:fix"

[tasks.style]
description = "Stylelint を実行する"
run = "docker exec {{vars.client_container}} npm run style"

[tasks."style:fix"]
description = "Stylelint を --fix オプション付きで実行する"
run = "docker exec {{vars.client_container}} npm run style:fix"

[tasks.tcm]
description = "tcm を実行する"
run = "docker exec {{vars.client_container}} npm run tcm"

[tasks."tcm:watch"]
description = "tcm を --watch オプション付きで実行する"
run = "docker exec {{vars.client_container}} npm run tcm:watch"

[tasks.prism]
description = "Prism のモックサーバーを起動する"
run = "docker exec {{vars.client_container}} npm run prism"
