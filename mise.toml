[tools]
atlas = "1.1.0"
bun = "1.3.12"
lefthook = "2.1.4"
mago = "1.14.1"
pinact = "3.9.0"

[vars]
server_tag = "8.5"
proxy_tag = "1.27"
openapi_tag = "7.21.0"
mysql_tag = "8.4"
uid = "`id -u`"
user_name = "`id -un`"
gid = "`id -g`"
group_name = "`id -gn`"

[env]
SERVER_TAG = "{{vars.server_tag}}"
PROXY_TAG = "{{vars.proxy_tag}}"
OPENAPI_TAG = "{{vars.openapi_tag}}"
SERVER_IMAGE = "isekai-observatory-api:{{vars.server_tag}}"
PROXY_IMAGE = "isekai-observatory-proxy:{{vars.proxy_tag}}"
OPENAPI_IMAGE = "openapi-generator:{{vars.openapi_tag}}"
MYSQL_IMAGE = "isekai-observatory-mysql:{{vars.mysql_tag}}"
NODE_EXTRA_CA_CERTS = "../../docker/php/certs/rootCA.pem"
OAS_FILE = "IsekaiObservatory.Admin.v1.yaml"

[tasks.setup]
description = "環境構築をする"
run = [
  { task = "cert:make" },
  { task = "cert:copy-pem" },
  { task = "build" },
  { tasks = ["composer:install", "bun:install"] },
  { task = "up" },
]

[tasks.build]
description = "開発環境向けの Docker イメージをビルドする"
depends = "build:*"

[tasks."build:proxy"]
description = "Nginx のイメージをビルドする"
run = "docker build -t ${PROXY_IMAGE} ./docker/nginx --build-arg TAG=${PROXY_TAG}"

[tasks."build:php"]
description = "PHP のイメージをビルドする"
run = '''
docker build -t ${SERVER_IMAGE} ./docker/php \
  --build-arg TAG=${SERVER_TAG} \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:openapi-generator"]
description = "OpenAPI Generator のイメージをビルドする"
run = '''
docker build -t ${OPENAPI_IMAGE} ./docker/openapi-generator \
  --build-arg TAG=${OPENAPI_TAG} \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:mysql"]
description = "MySQL のイメージをビルドする"
run = "docker build -t ${MYSQL_IMAGE} ./docker/mysql --build-arg TAG={{vars.mysql_tag}}"

[tasks.up]
description = "コンテナを起動する"
run = '''
worktree_root=$(git rev-parse --show-toplevel)
worktree_name=$(basename "$worktree_root")
root_proxy_http_port=80
root_proxy_https_port=443
root_php_port=8080
root_mysql_port=3306
root_redis_port=6379
root_redis_http_port=8079
worktree_proxy_http_port_base=10080
worktree_proxy_https_port_base=10443
worktree_php_port_base=18080
worktree_mysql_port_base=13306
worktree_redis_port_base=16379
worktree_redis_http_port_base=18079

if [ "$worktree_name" = "isekai-observatory" ]; then
  proxy_http_port=$root_proxy_http_port
  proxy_https_port=$root_proxy_https_port
  php_port=$root_php_port
  mysql_port=$root_mysql_port
  redis_port=$root_redis_port
  redis_http_port=$root_redis_http_port
else
  # Use a deterministic 0-999 offset per worktree directory name so each
  # additional worktree gets stable, non-conflicting high ports.
  port_offset=$(python -c 'import os, sys, zlib; print(zlib.crc32(os.path.basename(sys.argv[1]).encode()) % 1000)' "$worktree_root")
  proxy_http_port=$((worktree_proxy_http_port_base + port_offset))
  proxy_https_port=$((worktree_proxy_https_port_base + port_offset))
  php_port=$((worktree_php_port_base + port_offset))
  mysql_port=$((worktree_mysql_port_base + port_offset))
  redis_port=$((worktree_redis_port_base + port_offset))
  redis_http_port=$((worktree_redis_http_port_base + port_offset))
fi

PROXY_HTTP_PORT=$proxy_http_port \
PROXY_HTTPS_PORT=$proxy_https_port \
PHP_PORT=$php_port \
MYSQL_PORT=$mysql_port \
REDIS_PORT=$redis_port \
REDIS_HTTP_PORT=$redis_http_port \
docker compose up -d

echo "worktree: $worktree_name"
echo "proxy (http):  http://127.0.0.1:$proxy_http_port"
echo "proxy (https): https://127.0.0.1:$proxy_https_port"
echo "php:           http://127.0.0.1:$php_port"
echo "mysql:         127.0.0.1:$mysql_port"
echo "redis:         127.0.0.1:$redis_port"
echo "redis-http:    http://127.0.0.1:$redis_http_port"
'''

[tasks.down]
description = "コンテナを削除する"
run = "docker compose down"

[tasks.php]
description = "php コンテナの中に入る"
run = "docker compose exec php bash"

[tasks."composer:install"]
description = "composer パッケージをインストールする"
run = "docker compose run --rm php composer install"

[tasks.phpstan]
description = "PHPStan を実行する"
usage = 'arg "[path]" var=#true help="静的解析対象パス"'
run = "docker compose exec -T php composer phpstan ${usage_path}"

[tasks."phpstan:clear-cache"]
description = "PHPStan のキャッシュを削除する"
run = "docker compose exec -T php composer phpstan-clear-cache"

[tasks.arkitect]
description = "PHPArkitect を実行する"
run = "docker compose exec -T php composer arkitect"

[tasks.ecs]
description = "ECS を実行し、コードフォーマットをチェックする"
usage = 'arg "[path]" var=#true help="フォーマットチェック対象パス"'
run = "docker compose exec -T php composer ecs ${usage_path}"

[tasks."ecs:fix"]
description = "ECS を実行し、フォーマットを自動修正する"
usage = 'arg "[path]" var=#true help="フォーマット自動修正対象パス"'
run = "docker compose exec -T php composer ecs-fix ${usage_path}"

[tasks.test]
description = "テストを実行する"
usage = '''
arg "[path]" var=#true help="テスト対象パス"
'''
run = "docker compose exec -T php ./vendor/bin/paratest ${usage_path}"

[tasks."test:all"]
description = "すべてのテストを実行する"
run = "docker compose exec -T php composer test-all"

[tasks."test:unit"]
description = "Unit テストを実行する"
run = "docker compose exec -T php composer test-unit"

[tasks."test:integration"]
description = "Integration テストを実行する"
run = "docker compose exec -T php composer test-integration"

[tasks."test:feature"]
description = "Feature テストを実行する"
run = "docker compose exec -T php composer test-feature"

[tasks.coverage]
description = "テストカバレッジを出力する"
run = "docker compose exec -T php composer coverage"

[tasks.infection]
description = "ミューテーションテストを実行する"
run = "docker compose exec -T php composer infection"

[tasks.metrics]
description = "コードメトリクスを出力する"
run = "docker compose exec -T php composer metrics"

[tasks.migrate]
description = "スキーマをデータベースに適用する"
depends = ["migrate:local", "migrate:testing"]

[tasks."migrate:local"]
description = "スキーマを local データベースに適用する"
dir = "src/server/database/atlas"
run = 'atlas schema apply --env local --var "db_name=${DB_DATABASE}"'

[tasks."migrate:local".env]
_.file = "src/server/.env"

[tasks."migrate:testing"]
description = "スキーマを testing データベースに適用する"
dir = "src/server/database/atlas"
run = 'atlas schema apply --env testing --var "db_name=${DB_DATABASE}"'

[tasks."migrate:testing".env]
_.file = "src/server/.env.testing"

[tasks."migrate:dry-run"]
quiet = true
description = "適用されるスキーマの差分を確認する（適用はしない）"
dir = "src/server/database/atlas"
run = 'atlas schema apply --env local --var "db_name=${DB_DATABASE}" --dry-run'

[tasks."migrate:dry-run".env]
_.file = "src/server/.env"

[tasks.tinker]
description = "Laravel tinker を実行する"
run = "docker compose exec php php artisan tinker"

[tasks."ide:doc"]
description = "Eloquent にカラム情報を書き込む"
run = "docker compose exec -T php php artisan ide-helper:models -RW -n"

[tasks.generate]
description = "OAS からコードを生成する"
depends = "generate:*"

[tasks."generate:server"]
description = "OAS からサーバーのコードを生成する"
run = '''
rm -rf ./src/server/Generated

docker run --rm -u {{vars.uid}}:{{vars.gid}} -v ".:/local" ${OPENAPI_IMAGE} generate \
  -i /local/src/contracts/generated/oas/${OAS_FILE} \
  -g php \
  -t /local/src/server/tools/openapi-generator/templates \
  -o /local/src/server/Generated
'''

[tasks."generate:client"]
description = "OAS からクライアントのコードを生成する"
dir = "src/admin"
run = '''
rm -rf src/generated

bun run generate:api
'''

[tasks."cert:make"]
description = "自己署名証明書を作成する"
run = '''
mkcert \
  --key-file docker/nginx/certs/server.key \
  --cert-file docker/nginx/certs/server.crt \
  localhost \
  127.0.0.1 \
  local.admin.isekaijoucho.fan \
  local.api.isekaijoucho.fan \
  local.isekaijoucho.fan
'''

[tasks."cert:copy-pem"]
description = "rootCA.pem をコピーする"
run = '''
caroot_pem=$(mkcert -CAROOT)/rootCA.pem
cp ${caroot_pem} docker/php/certs/
'''

[tasks."bun:install"]
description = "bun のパッケージをインストールする"
dir = "src/admin"
run = "bun install"

[tasks.format]
description = "ESLint と Stylelint を --fix オプション付きで実行する"
depends = ["lint:fix", "style:fix"]

[tasks.lint]
description = "ESLint を実行する"
dir = "src/admin"
run = "bun run lint"

[tasks."lint:fix"]
description = "ESLint を --fix オプション付きで実行する"
dir = "src/admin"
run = "bun run lint:fix"

[tasks.style]
description = "Stylelint を実行する"
dir = "src/admin"
run = "bun run style"

[tasks."style:fix"]
description = "Stylelint を --fix オプション付きで実行する"
dir = "src/admin"
run = "bun run style:fix"

[tasks.tcm]
description = "tcm を実行する"
dir = "src/admin"
run = "bun run tcm"

[tasks."tcm:watch"]
description = "tcm を --watch オプション付きで実行する"
dir = "src/admin"
run = "bun run tcm:watch"

[tasks.prism]
description = "Prism のモックサーバーを起動する"
dir = "src/admin"
run = "bun run prism"
