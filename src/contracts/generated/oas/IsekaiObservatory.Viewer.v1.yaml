      minLength: 1
      description: メディア種別名
    mediaUrl:
      type: string
      format: uri
      description: メディアURL
    orderNo:
      type: integer
      format: int32
      minimum: 1
      description: 表示順
    releaseGroupId:
      type: string
      format: uuid
      description: リリースグループID
    releaseGroupTitle:
      type: string
      minLength: 1
      description: リリースグループタイトル
    releaseId:
      type: string
      format: uuid
      description: リリースID
    releaseName:
      type: string
      minLength: 1
      description: リリース版名
    releasedOn:
      type: string
      format: date
      description: 発売日
    songId:
      type: string
      format: uuid
      description: 楽曲ID
    songTypeName:
      type: string
      minLength: 1
      description: 楽曲種別名
    title:
      type: string
      minLength: 1
      description: 楽曲名
    uuid:
      type: string
      format: uuid
      description: UUID v4
servers:
  - url: https://local.api.isekaijoucho.fan/{version}
    description: ローカル環境
    variables:
      version:
        default: ''
        enum:
          - v1
